<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiTech · Sistema de Exportación de Café y Cacao</title>
<meta name="description" content="Sistema de gestión de exportaciones de café y cacao hacia la Unión Europea — RiTech SAS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ritch.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23B9893B'/><text y='72' x='50' text-anchor='middle' font-size='64' font-family='Georgia,serif' fill='%232A1B13'>R</text></svg>">
</head>
<body>
<div id="app">
  <div class="loading">Cargando RiTech…</div>
</div>

<script type="module">
  import { sesion } from '/js/api.js';
  import { iniciarApp } from '/js/app.js';
  import { vistaLogin } from '/js/login.js';

  const contenedor = document.getElementById('app');

  function enrutar() {
    if (location.hash.startsWith('#/login') || !sesion.activo) {
      vistaLogin(contenedor);
    } else {
      iniciarApp(contenedor);
    }
  }

  window.addEventListener('hashchange', enrutar);
  enrutar();
</script>
</body>
</html>
